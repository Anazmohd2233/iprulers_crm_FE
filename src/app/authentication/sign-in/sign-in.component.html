<div class="sign-in-area">
    <div
        class="daxa-form auth-shell ml-auto mr-auto"
        [class.card-borderd-theme]="themeService.isCardBorder()"
        [class.component-dark-theme]="themeService.isDark()"
        [class.rtl-enabled]="themeService.isRTLEnabled()"
    >
        <section class="form-panel">
            <div class="brand-header">
                <img src="images/logo-main.png" alt="IP Rulers CRM" class="brand-logo">
            </div>

            <div class="title">
                <span class="form-kicker">Secure access</span>
                <h3>Sign in to your account</h3>
                <p>Use your admin username and password to continue.</p>
            </div>

            <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label class="main-label d-block lh-1 text-black" for="username">
                        User Name
                    </label>
                    <mat-form-field appearance="outline">
                        <mat-label>
                            Enter username
                        </mat-label>
                        <span matPrefix class="field-icon material-symbols-outlined">person</span>
                        <input matInput type="text" id="username" formControlName="username" autocomplete="username">
                    </mat-form-field>
                    <div class="error text-danger" *ngIf="authForm.get('username')!.hasError('required') && authForm.get('username')!.touched">
                        Username is required.
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label d-block lh-1 text-black" for="password">
                        Your Password
                    </label>
                    <mat-form-field appearance="outline">
                        <mat-label>
                            Enter your password
                        </mat-label>
                        <span matPrefix class="field-icon material-symbols-outlined">lock</span>
                        <input matInput [type]="hide ? 'password' : 'text'" id="password" formControlName="password" autocomplete="current-password">
                        <button mat-icon-button matSuffix type="button" (click)="hide = !hide" [attr.aria-label]="hide ? 'Show password' : 'Hide password'" [attr.aria-pressed]="!hide">
                            <span class="material-symbols-outlined">
                                {{hide ? 'visibility_off' : 'visibility'}}
                            </span>
                        </button>
                    </mat-form-field>
                    <div class="error text-danger" *ngIf="authForm.get('password')!.hasError('required') && authForm.get('password')!.touched">
                        Password is required.
                    </div>
                    <div class="error text-danger" *ngIf="authForm.get('password')!.hasError('minlength') && authForm.get('password')!.touched">
                        Password must be at least 8 characters long.
                    </div>
                </div>

                <button mat-button class="btn" type="submit" [disabled]="authForm.invalid">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>
        </section>
    </div>
</div>
